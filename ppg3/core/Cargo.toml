[package]
name = "ppg3-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
linux-sandbox = []

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fs2.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Test-only helper for core/tests/sandbox_unshare.rs — enter_sandbox needs
# a single-threaded process, which the cargo test harness is not.
[[bin]]
name = "sandbox_helper"
path = "src/bin/sandbox_helper.rs"
required-features = ["linux-sandbox"]
test = false
